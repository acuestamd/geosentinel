name: GeoSentinel Scanner

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', '*.html', '*.js', '*.cjs', 'scripts/**', 'fixtures/**', 'docs/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # One operational audit per week; no raw reports committed.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Quality gates
        run: |
          python -m unittest discover -v
          python evaluate.py --check
          node --test test_dashboard.cjs
      - name: Restore document history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            signal_documents.json
            environment_context.json
          key: geosentinel-documents-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geosentinel-documents-v3-
      - name: Collect and validate sources
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scanner_v2.py
      - name: Save document history
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            signal_documents.json
            environment_context.json
          key: geosentinel-documents-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build allowlisted static site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record weekly operational audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/record_operations.py
